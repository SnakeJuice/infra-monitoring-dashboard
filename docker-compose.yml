version: '3.8'

services:
  backend:
    build: ./server
    ports:
      - "4000:4000"
    # Montamos el socket de Docker para que el servidor pueda leer los contenedores
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PORT=4000

  frontend:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      - backend